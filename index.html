<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Duduzilla Birthday 💖</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#ffd6e8,#fff0f7,#ffc5db);
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}


#app{
width:95%;
max-width:600px;
}


.card{
position:relative;
background:white;
border-radius:40px;
padding:40px 35px;
min-height:550px;
text-align:center;
box-shadow:0 0 50px #ff9fc5;
border:4px solid #ffd1e3;
animation:show 1s;
}


@keyframes show{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}


h1{
color:#ff4f8b;
font-size:38px;
}


p{
font-size:21px;
line-height:1.8;
color:#555;
}


button{
background:#ff6fa8;
border:0;
color:white;
font-size:20px;
padding:15px 35px;
border-radius:50px;
cursor:pointer;
margin-top:20px;
}


.envelope{
width:330px;
height:210px;
background:#ff78aa;
margin:30px auto;
border-radius:20px;
position:relative;
cursor:pointer;
}


.flap{
position:absolute;
border-left:165px solid transparent;
border-right:165px solid transparent;
border-top:120px solid #ffc0d9;
}


.paper{
position:absolute;
background:white;
width:280px;
height:170px;
left:25px;
top:20px;
border-radius:20px;
font-size:60px;
display:flex;
align-items:center;
justify-content:center;
z-index:-1;
transition:1s;
}


.open .paper{
transform:translateY(-120px);
z-index:2;
}


.characters{
display:flex;
justify-content:space-between;
align-items:center;
}


.characters img{
width:150px;
height:150px;
object-fit:contain;
animation:float 3s infinite;
}


@keyframes float{
50%{
transform:translateY(-15px);
}
}


.centerText{
width:55%;
}


.bigImage{
width:260px;
max-height:220px;
object-fit:contain;
}



.heart{
font-size:80px;
cursor:pointer;
animation:pulse 1s infinite;
}


@keyframes pulse{
50%{
transform:scale(1.2);
}
}


</style>

</head>


<body>


<div id="app"></div>


<script>


let app=document.getElementById("app");


function start(){

app.innerHTML=`

<div class="card">

<h1>
💌 Birthday Quest 💌
</h1>

<p>
A secret surprise was created for my Duduzilla ❤️
</p>

<div class="heart" onclick="heart()">
💗
</div>

<p>
Find the magic heart
</p>

</div>

`;

}


function heart(){

app.innerHTML=`

<div class="card">

<h1>
✨ You found it ✨
</h1>

<div class="envelope" onclick="openMail(this)">

<div class="paper">
💌
</div>

<div class="flap"></div>

</div>

<p>
Click the envelope twice 💕
</p>

</div>

`;

}


let clicks=0;

function openMail(el){

clicks++;

el.classList.add("open");

if(clicks==2){
first();
}

}


function first(){

app.innerHTML=`

<div class="card">


<div class="characters">

<img src="dudu.png">

<div class="centerText">

<h1>
💖 Happy Birthday My Duduzilla 💖
</h1>

<p>

Today is a very special day for a very special person.

<br><br>

Happy birthday, my Duduzilla!

<br><br>

This is my first time creating something like this hehe 🤭

<br><br>

I wish you the sweetest and best things in this world.

<br><br>

You are strong, handsome, smart, hot and the cutest person ever.

<br><br>

I love you so much ❤️

</p>

</div>

<img src="bubu.png">

</div>


<button onclick="minions()">
Continue 💕
</button>


</div>

`;

}



function minions(){

app.innerHTML=`

<div class="card">

<img class="bigImage" src="minions.png">


<h1>
🍌 Minion Message 🍌
</h1>


<p>

Even the Minions know:

<br><br>

You are funny, amazing and one of a kind.

<br><br>

Keep smiling and chasing your dreams ❤️

</p>


<button onclick="cats()">
Continue 💕
</button>

</div>

`;

}



function cats(){

app.innerHTML=`

<div class="card">


<div class="characters">

<img src="mew.png">

<div class="centerText">

<h1>
🐱 Cat Love Message 🐱
</h1>


<p>

The little cats want to remind you:

<br><br>

You deserve endless happiness, love and beautiful moments.

<br><br>

Never forget how special you are ❤️

</p>


</div>


<img src="mew2.png">


</div>


<button onclick="finalPage()">
Continue 💖
</button>


</div>

`;

}



function finalPage(){

app.innerHTML=`

<div class="card">

<h1>
🎂 Happy Birthday Duduzilla 🎂
</h1>


<p>

This little adventure was made only for you.

<br><br>

Distance cannot change how much you mean to me.

<br><br>

Thank you for every smile and every moment.

<br><br>

I love you forever ❤️

</p>


<img class="bigImage" src="dudu.png">


</div>

`;

}


start();


</script>


</body>
</html>
