<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Duduzilla Birthday Adventure 💖</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:'Arial',sans-serif;
background:radial-gradient(circle,#3d174f,#140020);
display:flex;
justify-content:center;
align-items:center;
color:white;
}


.stars{
position:absolute;
width:100%;
height:100%;
}


.star{
position:absolute;
font-size:20px;
animation:float 5s infinite;
}


@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-20vh);opacity:0;}
}


.screen{
text-align:center;
z-index:5;
}


h1{
font-size:34px;
color:#ffd1e6;
text-shadow:0 0 15px pink;
}


p{
font-size:20px;
}


.heart{
font-size:45px;
cursor:pointer;
position:absolute;
animation:pulse 1s infinite;
}


@keyframes pulse{
50%{transform:scale(1.3);}
}



.envelope{
display:none;
width:300px;
height:190px;
background:#ff7fae;
border-radius:15px;
position:relative;
cursor:pointer;
box-shadow:0 0 40px pink;
margin:auto;
transition:1s;
}


.envelope:before{
content:"";
position:absolute;
top:0;
left:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-top:100px solid #ffb5d1;
}


.front{
position:absolute;
bottom:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-bottom:100px solid #ff5f98;
}


.paper{
position:absolute;
width:240px;
height:140px;
background:white;
left:30px;
top:30px;
border-radius:10px;
color:#ff4f8b;
padding:20px;
transform:translateY(0);
transition:1s;
z-index:-1;
}


.open .paper{
transform:translateY(-120px);
}


.fly .paper{
transform:translateY(-350px) scale(1.2);
}


.message{
display:none;
background:white;
color:#555;
width:340px;
padding:25px;
border-radius:25px;
animation:appear 1s;
}


.message h2{
color:#ff4f8b;
}


@keyframes appear{
from{
opacity:0;
transform:scale(.3);
}
to{
opacity:1;
transform:scale(1);
}
}


button{
background:#ff6fa8;
color:white;
border:0;
padding:12px 25px;
border-radius:30px;
font-size:18px;
cursor:pointer;
}


</style>

</head>


<body>


<div class="stars" id="stars"></div>


<div class="screen">


<div id="game">

<h1>💌 A Secret Birthday Mission 💌</h1>

<p>
Find the magic heart to open Duduzilla's surprise ❤️
</p>


</div>


<div class="envelope" id="envelope" onclick="openEnvelope()">

<div class="paper">
💌
</div>

<div class="front"></div>

</div>



<div class="message" id="message">

<h2>💖 Happy Birthday My Duduzilla 💖</h2>

<p>
Today is a very special day for a very special person...

<br><br>

Your secret birthday adventure has started ✨

</p>

<button onclick="alert('More surprises coming ❤️')">
Continue 💕
</button>

</div>


</div>




<script>


// stars

for(let i=0;i<40;i++){

let s=document.createElement("div");

s.className="star";
s.innerHTML="✨";

s.style.left=Math.random()*100+"%";
s.style.animationDelay=Math.random()*5+"s";

document.getElementById("stars").appendChild(s);

}



// magic heart

let goodHeart=document.createElement("div");

goodHeart.className="heart";
goodHeart.innerHTML="❤️";

goodHeart.style.left=Math.random()*80+"%";
goodHeart.style.top=Math.random()*70+"%";

document.body.appendChild(goodHeart);


goodHeart.onclick=function(){

goodHeart.style.display="none";

document.getElementById("game").innerHTML=

"<h1>✨ You found it! ✨</h1><p>The secret letter is waiting...</p>";


setTimeout(()=>{

document.getElementById("envelope").style.display="block";

},1500);


}




let clicks=0;


function openEnvelope(){

clicks++;

let env=document.getElementById("envelope");


if(clicks==1){

env.classList.add("open");

}


if(clicks==2){

env.classList.add("fly");


setTimeout(()=>{

env.style.display="none";

document.getElementById("message").style.display="block";

},1000);


}


}



</script>


</body>
</html>
