<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Duduzilla Birthday Quest 💖</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:"Arial",sans-serif;
background:linear-gradient(135deg,#ffd6e8,#fff5fb,#ffd1dc);
display:flex;
justify-content:center;
align-items:center;
}

#app{
width:95%;
max-width:500px;
text-align:center;
}

h1{
color:#ff4f8b;
font-size:32px;
text-shadow:0 0 15px #ffb6d2;
}

h2{
color:#ff4f8b;
}

p{
font-size:18px;
line-height:1.7;
color:#555;
}


button{
background:linear-gradient(45deg,#ff5f9e,#ff8fc1);
border:none;
color:white;
font-size:18px;
padding:15px 35px;
border-radius:50px;
cursor:pointer;
box-shadow:0 8px 20px #ffb6d2;
margin-top:20px;
}


.card{

background:white;
border-radius:35px;
padding:35px 25px;
width:100%;
min-height:500px;
box-shadow:0 0 40px rgba(255,120,170,.5);
animation:appear 1s;
border:3px solid #ffd0e2;

}


@keyframes appear{

from{
opacity:0;
transform:scale(.6);
}

to{
opacity:1;
transform:scale(1);
}

}



.stars span{

position:absolute;
font-size:22px;
animation:move 5s infinite linear;

}


@keyframes move{

from{
transform:translateY(100vh);
opacity:0;
}

50%{
opacity:1;
}

to{
transform:translateY(-20vh);
opacity:0;
}

}



img{

max-width:220px;
max-height:220px;
object-fit:contain;
animation:float 3s infinite ease-in-out;

}


@keyframes float{

50%{
transform:translateY(-12px);
}

}



.envelope{

width:320px;
height:200px;
background:#ff79ad;
margin:30px auto;
position:relative;
border-radius:20px;
cursor:pointer;
box-shadow:0 0 40px pink;

}


.flap{

position:absolute;
top:0;
left:0;

border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:110px solid #ffb9d5;

transform-origin:top;
transition:1s;

}


.paper{

position:absolute;
background:white;
width:270px;
height:170px;
left:25px;
top:20px;
border-radius:20px;
z-index:-1;
transition:1s;
color:#ff4f8b;
font-size:50px;
display:flex;
align-items:center;
justify-content:center;

}


.open .flap{

transform:rotateX(180deg);

}


.open .paper{

transform:translateY(-130px);
z-index:2;

}



.characters{

display:flex;
justify-content:center;
gap:15px;
align-items:center;
margin-bottom:15px;

}


.small{

width:140px;
height:140px;

}


</style>
</head>


<body>


<div class="stars"></div>


<div id="app">


<div class="card">

<h1>
💌 Secret Birthday Quest 💌
</h1>


<p>
A special adventure was created for the most special person...
</p>


<button onclick="startQuest()">
Start the magic ✨
</button>


</div>


</div>
<script>

let app=document.getElementById("app");


let stars=document.querySelector(".stars");

for(let i=0;i<35;i++){

let s=document.createElement("span");
s.innerHTML="✨";
s.style.left=Math.random()*100+"%";
s.style.animationDelay=Math.random()*5+"s";
stars.appendChild(s);

}



function startQuest(){

app.innerHTML=`

<div class="card">

<h1>❤️ Find the magic heart ❤️</h1>

<p>
A little challenge before the surprise...
</p>

<div onclick="foundHeart()" style="font-size:70px;cursor:pointer;">
💗
</div>

<p>
Touch the heart ✨
</p>

</div>

`;

}




function foundHeart(){

app.innerHTML=`

<div class="card">

<h1>
✨ You found the secret! ✨
</h1>

<p>
The birthday letter is waiting for you...
</p>


<div class="envelope" onclick="openEnvelope()">

<div class="paper">
💌
</div>

<div class="flap"></div>

</div>


<p>
Tap the envelope twice 💕
</p>


</div>

`;

}



let clicks=0;


function openEnvelope(){

clicks++;

let env=document.querySelector(".envelope");


if(clicks===1){

env.classList.add("open");

}


if(clicks===2){

firstLetter();

}

}




function firstLetter(){

app.innerHTML=`

<div class="card">


<div class="characters">

<img src="dudu.png" class="small">

<img src="bubu.png" class="small">

</div>


<h1>
💖 Happy Birthday My Duduzilla 💖
</h1>


<p>

Today is a very special day for a very special person.

<br><br>

Happy birthday, my Duduzilla! 🎂

<br><br>

This is my first time creating something like this,
so I hope I am doing everything right hehe 🤭

<br><br>

I wish you the sweetest and the best things in this world.

<br><br>

I wish you endless happiness, success, good health and dreams coming true.

<br><br>

You are the strongest, most handsome, smartest, hottest and cutest person in the whole world.

<br><br>

I love you so much ❤️

</p>


<button onclick="minionsLetter()">
Continue the journey 💕
</button>


</div>

`;

}




function minionsLetter(){

app.innerHTML=`

<div class="card">


<img src="minions.png">


<h1>
🍌 A Minion Message 🍌
</h1>


<p>

Even the Minions know one thing...

<br><br>

You are one of the coolest and funniest people ever!

<br><br>

Never stop smiling, dreaming and being amazing.

<br><br>

You deserve all the happiness in the world ❤️

</p>


<button onclick="catsLetter()">
Continue the journey 💕
</button>


</div>

`;

}
function catsLetter(){

app.innerHTML=`

<div class="card">


<div class="characters">

<img src="mew.png" class="small">

<img src="mew2.png" class="small">

</div>


<h1>
🐱 A Little Cat Message 🐱
</h1>


<p>

Even the little cats have something to tell you...

<br><br>

You deserve endless love, happiness and beautiful moments.

<br><br>

Never forget how special and amazing you are ❤️

<br><br>

Keep smiling, keep dreaming and always stay yourself.

</p>


<button onclick="finalSurprise()">
Continue the journey 💕
</button>


</div>

`;

}




function finalSurprise(){

app.innerHTML=`

<div class="card">


<h1>
🎂✨ Happy Birthday Duduzilla ✨🎂
</h1>


<p style="font-size:55px">
🎉❤️🎉
</p>


<p>

This little adventure was made especially for you.

<br><br>

Even if we are far away,
you are always close to my heart.

<br><br>

Thank you for every smile,
every conversation and every beautiful moment.

<br><br>

You are my favorite person.

<br><br>

I love you forever ❤️

</p>


<div class="characters">

<img src="dudu.png" class="small">

<img src="bubu.png" class="small">

</div>


<p style="font-size:35px">
❤️✨🎆✨❤️
</p>


</div>

`;


for(let i=0;i<60;i++){

let heart=document.createElement("span");

heart.innerHTML="❤️";

heart.style.position="absolute";
heart.style.left=Math.random()*100+"%";
heart.style.top=Math.random()*100+"%";
heart.style.fontSize=(15+Math.random()*25)+"px";

document.body.appendChild(heart);

}


}



</script>

</body>

</html>
