<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Duduzilla Birthday Quest 💌</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(#140022,#3d1655);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.stars span{
position:absolute;
animation:fall linear infinite;
font-size:18px;
}

@keyframes fall{
from{transform:translateY(100vh);opacity:0}
50%{opacity:1}
to{transform:translateY(-20vh);opacity:0}
}

.box{
text-align:center;
width:90%;
max-width:420px;
}

h1{
color:#ffd1e8;
text-shadow:0 0 20px pink;
}

button{
background:#ff6fa8;
border:0;
padding:15px 30px;
border-radius:40px;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.heart{
font-size:55px;
cursor:pointer;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.3)}
}


.envelope{
width:280px;
height:170px;
background:#ff78aa;
margin:auto;
border-radius:15px;
position:relative;
cursor:pointer;
box-shadow:0 0 40px pink;
}

.flap{
position:absolute;
top:0;
border-left:140px solid transparent;
border-right:140px solid transparent;
border-top:90px solid #ffb6d2;
transform-origin:top;
transition:1s;
}

.paper{
position:absolute;
width:230px;
height:130px;
background:white;
left:25px;
top:20px;
border-radius:15px;
color:#ff4f8b;
padding:20px;
transition:1s;
z-index:-1;
}

.open .flap{
transform:rotateX(180deg);
}

.open .paper{
transform:translateY(-100px);
z-index:2;
}


.card{
background:white;
color:#555;
padding:25px;
border-radius:25px;
animation:show 1s;
}

.card h2{
color:#ff4f8b;
}


@keyframes show{
from{
opacity:0;
transform:scale(.5);
}
to{
opacity:1;
transform:scale(1);
}
}


.fly{
animation:fly 1s forwards;
}

@keyframes fly{
to{
transform:translateY(-300px) scale(1.2);
opacity:0;
}
}

</style>
</head>


<body>


<div class="stars"></div>


<div class="box" id="app">

<h1>💌 Secret Birthday Quest 💌</h1>

<p>
A special surprise was created for one special person...
</p>

<button onclick="start()">
START ✨
</button>

</div>


<script>


let stars=document.querySelector(".stars");

for(let i=0;i<40;i++){
let s=document.createElement("span");
s.innerHTML="✨";
s.style.left=Math.random()*100+"%";
s.style.animationDuration=(3+Math.random()*5)+"s";
stars.appendChild(s);
}


function start(){

app.innerHTML=`

<h1>❤️ Find the magic heart ❤️</h1>

<p>
Only the right heart can unlock the surprise
</p>

<div class="heart" onclick="found()">
💗
</div>

`;

}


function found(){

app.innerHTML=`

<h1>✨ You found it! ✨</h1>

<p>The secret letter is waiting...</p>

<div class="envelope" onclick="openLetter()">

<div class="paper">
💌
</div>

<div class="flap"></div>

</div>

`;

}


let clicks=0;


function openLetter(){

clicks++;

let env=document.querySelector(".envelope");


if(clicks==1){

env.classList.add("open");

}


if(clicks==2){

env.classList.add("fly");

setTimeout(letter,1000);

}

}


function letter(){

app.innerHTML=`

<div class="card">

<h2>
💖 Happy Birthday My Duduzilla 💖
</h2>


<p>
Today is a very special day for a very special person.

<br><br>

Happy birthday, my Duduzilla!

<br><br>

This is my first time creating something like this,
so I hope I am doing everything right hehe 🤭

<br><br>

I wish you the sweetest and the best things in this world.

<br><br>

I love you so much and I appreciate every moment we spend together, even when we are far away.

<br><br>

You are the strongest, most handsome, smartest, hottest and cutest person in the whole world.

<br><br>

❤️ I love you ❤️

</p>


<button onclick="next()">
Open next surprise 🐻🐼
</button>


</div>

`;

}



function next(){

app.innerHTML=`

<div class="card">

<h2>
🐻 Dudu & Bubu 🐼
</h2>


<p>

Even distance cannot separate two hearts.

<br><br>

Thank you for being my favorite person.

<br><br>

You are my happiness, my smile and my special one ❤️

<br><br>

🎂 Happy Birthday 🎂

</p>


<button onclick="finalPage()">
Final surprise ✨
</button>


</div>

`;

}



function finalPage(){

app.innerHTML=`

<div class="card">

<h2>
🎂✨ Surprise ✨🎂
</h2>


<p style="font-size:45px">
❤️🎉❤️
</p>


<p>

No matter how far we are,
you will always have a special place in my heart.

<br><br>

I love you forever, Duduzilla ❤️

</p>


</div>

`;

for(let i=0;i<80;i++){

let h=document.createElement("span");
h.innerHTML="❤️";
h.style.position="absolute";
h.style.left=Math.random()*100+"%";
h.style.top=Math.random()*100+"%";
h.style.fontSize="25px";

document.body.appendChild(h);

}


}


</script>

</body>
</html>
