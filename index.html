<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Happy Birthday Duduzilla ❤️</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#ffd6e8,#fff5fb,#ffc9df);
font-family:"Georgia",serif;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
}


#app{
width:100%;
max-width:1000px;
padding:20px;
}


.card{
background:white;
border-radius:45px;
padding:35px 45px;
min-height:430px;
box-shadow:0 0 50px rgba(255,100,160,.45);
border:4px solid #ffd1e3;
animation:show 0.8s ease;
position:relative;
}


@keyframes show{

from{
opacity:0;
transform:scale(.8);
}

to{
opacity:1;
transform:scale(1);
}

}


h1{
text-align:center;
color:#ff4f8b;
font-size:38px;
}


p{
text-align:center;
font-size:21px;
line-height:1.8;
color:#555;
}


button{

display:block;
margin:25px auto 0;

background:linear-gradient(45deg,#ff5f9e,#ff91c4);

border:none;
border-radius:50px;

padding:16px 40px;

font-size:20px;

color:white;

cursor:pointer;

box-shadow:0 8px 20px #ffc1dc;

}


button:hover{

transform:scale(1.08);

}


.characters{

display:grid;

grid-template-columns:220px 1fr 220px;

align-items:center;

gap:15px;

}


.characters img{

width:220px;

height:220px;

object-fit:contain;

animation:float 3s infinite ease-in-out;

}


@keyframes float{

50%{

transform:translateY(-15px);

}

}


.centerText{

width:100%;

}


.envelope{

width:350px;

height:220px;

background:#ff79ad;

margin:40px auto;

border-radius:25px;

position:relative;

cursor:pointer;

box-shadow:0 0 35px pink;

}


.flap{

position:absolute;

border-left:175px solid transparent;

border-right:175px solid transparent;

border-top:125px solid #ffc1dc;

}


.paper{

position:absolute;

background:white;

width:290px;

height:180px;

left:30px;

top:20px;

border-radius:25px;

display:flex;

justify-content:center;

align-items:center;

font-size:70px;

z-index:-1;

transition:1s;

}


.open .paper{

transform:translateY(-140px);

z-index:3;

}


.heart{

font-size:90px;

text-align:center;

cursor:pointer;

animation:pulse 1s infinite;

}


@keyframes pulse{

50%{

transform:scale(1.15);

}

}


.bigImage{

display:block;

width:260px;

height:220px;

object-fit:contain;

margin:auto;

}


.floating{

position:fixed;

font-size:25px;

animation:fall linear infinite;

}


@keyframes fall{

from{

transform:translateY(-100px);

}

to{

transform:translateY(110vh);

}

}


</style>

</head>


<body>


<div id="app"></div>


<script>


let app=document.getElementById("app");


function hearts(){

for(let i=0;i<25;i++){

let h=document.createElement("div");

h.className="floating";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(h);

}

}


hearts();


function start(){

app.innerHTML=`

<div class="card">

<h1>
💌 Birthday Quest 💌
</h1>


<p>
A secret surprise was created especially for my Duduzilla ❤️
</p>


<div class="heart" onclick="findHeart()">
💗
</div>


<p>
Find the magic heart
</p>


</div>

`;

}


function findHeart(){

app.innerHTML=`

<div class="card">

<h1>
✨ You found the secret ✨
</h1>


<div class="envelope" onclick="openEnvelope(this)">

<div class="paper">
💌
</div>

<div class="flap"></div>

</div>


<p>
Click the envelope twice 💕
</p>


</div>

`;

}


let count=0;


function openEnvelope(e){

count++;

e.classList.add("open");


if(count==2){

letterOne();

}

}
function letterOne(){

app.innerHTML=`

<div class="card">

<div class="characters">

<img src="dudu.png">


<div class="centerText">

<h1>
💖 Happy Birthday My Duduzilla 💖
</h1>


<p>

Today is a very special day for a very special person.

<br><br>

Happy birthday, my Duduzilla! 🎂

<br><br>

This is my first time creating something like this hehe 🤭

<br><br>

I wish you the sweetest and the best things in this world.

<br><br>

I love and appreciate every moment we spend together,
even when we are far away.

<br><br>

You are the strongest, most handsome,
smartest, hottest and cutest person in the whole world.

<br><br>

I love you so much ❤️

</p>


</div>


<img src="bubu.png">

</div>


<button onclick="minions()">
Continue 💕
</button>


</div>

`;

}



function minions(){

app.innerHTML=`

<div class="card">


<img class="bigImage" src="minions.png">


<h1>
🍌 Minion Message 🍌
</h1>


<p>

Even the Minions have something to say...

<br><br>

You are funny, amazing and one of a kind.

<br><br>

Keep smiling, keep dreaming and never forget
how special you are ❤️

</p>


<button onclick="cats()">
Continue 💕
</button>


</div>

`;

}




function cats(){

app.innerHTML=`

<div class="card">


<div class="characters">


<img src="mew.png">


<div class="centerText">


<h1>
🐱 Cat Love Letter 🐱
</h1>


<p>

The little cats came with a message...

<br><br>

You deserve endless happiness,
love and beautiful moments.

<br><br>

Thank you for being you ❤️

<br><br>

Never forget how loved you are.

</p>


</div>


<img src="mew2.png">


</div>


<button onclick="finalPage()">
Continue ❤️
</button>


</div>

`;

}




function finalPage(){

app.innerHTML=`

<div class="card">


<h1>
🎂 Happy Birthday Duduzilla 🎂
</h1>


<p>

This little adventure was made only for you.

<br><br>

Even though we are far away,
you are always close to my heart.

<br><br>

Thank you for every smile,
every conversation and every beautiful moment.

<br><br>

You are my favorite person ❤️

<br><br>

I love you forever.

</p>


<div class="characters">

<img src="dudu.png">

<div>
❤️✨❤️✨❤️
</div>

<img src="bubu.png">

</div>


</div>

`;

}



start();


</script>


</body>
</html>
